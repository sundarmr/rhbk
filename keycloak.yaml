apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # CRD doesn't exist when Argo validates the sync; apply it once the operator is up
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  instances: 1
  db:
    vendor: postgres
    host: postgresql.postgres-dev.svc.cluster.local
    port: 5432
    database: keycloak          # change if your database has a different name
    usernameSecret:
      name: keycloak-db-secret
      key: username
    passwordSecret:
      name: keycloak-db-secret
      key: password
  http:
    httpEnabled: true           # TLS terminates at the OpenShift router
  hostname:
    hostname: keycloak.apps.CHANGE-ME.example.com   # set to your route host
  proxy:
    headers: xforwarded
  ingress:
    enabled: true
