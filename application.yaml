apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhbk-deployment
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: 'https://github.com/your-org/sso-gitops.git'
    targetRevision: HEAD
    path: environments/prod
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: keycloak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true